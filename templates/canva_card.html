<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-container {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            width: 85vw;
            max-width: 550px;
            padding: 45px 35px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.8);
            overflow: hidden;
        }

        /* Decorative Canva-style background circles */
        .card-container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 140px;
            height: 140px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 50%;
        }

        .card-container::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 140px;
            height: 140px;
            background: rgba(118, 75, 162, 0.15);
            border-radius: 50%;
        }

        .user-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #764ba2;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
        }

        .badge {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: #ffffff;
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(255, 126, 95, 0.3);
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .message {
            color: #4a5568;
            font-size: 18px;
            line-height: 1.7;
            margin: 20px 0 35px 0;
            padding: 0 10px;
            font-weight: 400;
        }

        .btn-link {
            display: inline-block;
            padding: 16px 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff !important;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
            border: none;
        }
    </style>
</head>
<body>
    <div class="card-container">
        {{PHOTO_HTML}}
        <div class="badge">{{AGE_TEXT}}</div>
        <h1>{{TITLE_TEXT}}</h1>
        <p class="message">"{{MESSAGE_TEXT}}"</p>
        <a href="{{WEBSITE_URL}}" class="btn-link" target="_blank">
            {{BUTTON_TEXT}}
        </a>
    </div>
</body>
</html>
